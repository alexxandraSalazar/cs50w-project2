{% extends "auctions/layout.html" %}

{% block body %}
    <div class="container">
        <h2 class="mb-4 form-group text-center">Create Listing</h2>

        <form action="{% url 'create' %}" method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="title">Title:</label>
                <input class="form-control" type="text" name="title" id="title" placeholder="Title">
            </div>

            <div class="form-group">
                <label for="description">Description:</label>
                <input class="form-control" type="text" name="description" id="description" placeholder="Description">
            </div>

            <div class="form-group">
                <label for="image_url">Image URL:</label>
                <input class="form-control" type="text" name="image_url" id="image_url" placeholder="Image URL">
            </div>

            <div class="form-group">
                <label for="price">Price:</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text">$</span>
                    </div>
                    <input class="form-control" type="number" name="price" id="price" placeholder="Price">
                </div>
            </div>

            <div class="form-group">
                <label for="category">Category:</label>
                <select class="form-control" name="category" id="category">
                    {% for category in categorys %}
                        <option value="{{ category.name }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <button class="btn btn-primary form-group text-center" type="submit">Create</button>
        </form>
    </div>
{% endblock %}
