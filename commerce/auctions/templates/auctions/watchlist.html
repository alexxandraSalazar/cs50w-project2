{% extends "auctions/layout.html" %}

{% block body %}
    <div class="container">
        <h2>Watchlists</h2>

        <div class="row">
            {% for item in items %}
                <div class="col-md-6 mb-4">
                    <div class="card h-100 shadow">
                        <div class="row no-gutters">
                            <div class="col-md-4">
                                <img src="{{ item.image_url }}" alt="{{ item.title }}" class="card-img">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <h5 class="card-title"><a href="{% url 'listing' id=item.id %}" class="text-decoration-none stretched-link">{{ item.title }}</a></h5>
                                    <p class="card-text text-muted mb-2">Price: ${{ item.price }}</p>
                                    <p class="card-text">{{ item.description }}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
